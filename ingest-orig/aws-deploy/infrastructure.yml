Parameters:
  ##
  ## Settings
  ##
  DatabasePort:
    Type: Number
    Default: 5432

  DatabaseDBName:
    Type: String
    Default: talkradio

  KeyName:
    Type: String
    Default: talkradio-cf

  DesiredWorkerCount:
    Type: Number
    Default: "1"

  # DesiredClusterCount:
  #   Type: Number
  #   Default: 1

  DesiredCapacity:
    Type: Number
    Default: "0"
    Description: Number of EC2 instances to launch in your ECS cluster.

  MaxSize:
    Type: Number
    Default: "100"
    Description: Maximum number of EC2 instances that

  InstanceType:
    Type: String
    Default: t2.large

  TargetS3Bucket:
    Type: String
    Default: lsm-data   #  prev lsm-data

  TargetS3Prefix:
    Type: String
    Default: talk-radio

  SourceS3Bucket:
    Type: String
    Default: lsm-data   #  prev lsm-data

  SourceS3Key:
    Type: String
    Default: talk-radio/radio.tar.gz

  ##
  ## Resources we can't create here; create these manually
  ## and update the values here if redeploying the stack
  ## on a new account
  ##
  DatabaseUsername:
    Type: AWS::SSM::Parameter::Value<String>
    Default: talk-radio-db-username

  DatabasePassword:
    # this is the key name in ssm, not the pw itself
    Type: AWS::SSM::Parameter::Value<String>
    Default: talk-radio-db-password

  DatabasePasswordKey:
    Type: AWS::SSM::Parameter::Name<String>
    Default: talk-radio-db-password

  ##
  ## We could create these in the template, but creating our
  ## own VPC is a little aggressive. If deploying in a new
  ## account, update these values.
  ##
  ## Constraints:
  ##   o) All subnets must be in the VPC
  ##   o) The 'A' subnets have to be in a different availability
  ##      zone from the 'B' subnets.
  ##   o) Reasonable number of free IPs in each subnet, say 16+.
  ##   o) The compute subnets must be connected to the internet
  ##      and able to support assigning public IPs.
  ##
  Vpc:
    Type: AWS::EC2::VPC::Id
    Default: vpc-026cd1893623bde9f

  ComputeSubnetA:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0c7e17ea09da429aa

  ComputeSubnetB:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0b93092cea9b49291

  DBSubnetA:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-03371ebff7849ceb0

  DBSubnetB:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-028199d00a32fda59

  ECSAMI:
    Description: The Amazon Machine Image ID used for the cluster
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id

Mappings:
  # See https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-optimized_AMI.html
  AWSRegionToAMI:
    us-east-2:
      AMI: ami-ef64528a
    us-east-1:
      AMI: ami-02749f7a96386bacf
    us-west-2:
      AMI: ami-baa236c2
    us-west-1:
      AMI: ami-29b8b249
    eu-west-3:
      AMI: ami-0356e07e
    eu-west-2:
      AMI: ami-25f51242
    eu-west-1:
      AMI: ami-64c4871d
    eu-central-1:
      AMI: ami-3b7d1354
    ap-northeast-2:
      AMI: ami-3b19b455
    ap-northeast-1:
      AMI: ami-bb5f13dd
    ap-southeast-2:
      AMI: ami-a677b6c4
    ap-southeast-1:
      AMI: ami-f88ade84
    ca-central-1:
      AMI: ami-db48cfbf
    ap-south-1:
      AMI: ami-9e91cff1
    sa-east-1:
      AMI: ami-da2c66b6

Resources:

  # This is authorizes ECS to manage resources on your
  # account on your behalf. This role is likely already created on your account
  # ECSRole:
  #  Type: AWS::IAM::ServiceLinkedRole
  #  Properties:
  #    AWSServiceName: 'ecs.amazonaws.com'
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Ref KeyName
  
  ##
  ## IAM roles for other resources
  ##
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service:
                - ec2.amazonaws.com
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role"
        - "arn:aws:iam::aws:policy/CloudWatchLogsFullAccess"
        - "arn:aws:iam::aws:policy/AmazonS3FullAccess"
        - "arn:aws:iam::aws:policy/AmazonSSMFullAccess"
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"

  ##
  ## Security groups
  ##
  ComputeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupName: talk-radio
      GroupDescription: "Talk radio compute security group"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupName: talk-radio-dbs
      GroupDescription: "Talk radio DB security group"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0

  DBSecurityGroupDBIngress:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn:
      - ComputeSecurityGroup
      - DBSecurityGroup
    Properties:
      GroupId: !Ref DBSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DBSecurityGroup

  DBSecurityGroupComputeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn:
      - ComputeSecurityGroup
      - DBSecurityGroup
    Properties:
      GroupId: !Ref DBSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ComputeSecurityGroup

  ComputeSecurityGroupDBIngress:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn:
      - ComputeSecurityGroup
      - DBSecurityGroup
    Properties:
      GroupId: !Ref ComputeSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DBSecurityGroup

  ComputeSecurityGroupComputeIngressTCP:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn:
      - ComputeSecurityGroup
      - DBSecurityGroup
    Properties:
      GroupId: !Ref ComputeSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref ComputeSecurityGroup

  ComputeSecurityGroupComputeIngressUDP:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn:
      - ComputeSecurityGroup
      - DBSecurityGroup
    Properties:
      GroupId: !Ref DBSecurityGroup
      IpProtocol: udp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref ComputeSecurityGroup

  ##
  ## Our coordinating Postgres instance
  ##
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "Talk radio DB subnet"
      DBSubnetGroupName: "talk-radio-db-subnet-group"
      SubnetIds:
        - !Ref DBSubnetA
        - !Ref DBSubnetB

  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: "Talk radio postgres 15 DB parameter group"  # updated from postgres10
      Family: "postgres15"                                      # updated from postgres10
      Parameters:
        max_connections: "LEAST({DBInstanceClassMemory/3177131},5000)"  ##

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 50
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 30
      DBInstanceClass: "db.t3.medium"   #  "db.t2.small"
      DBName: !Ref DatabaseDBName
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBParameterGroupName: !Ref DBParameterGroup
      Engine: postgres
      EngineVersion: "15.4"
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Ref DatabasePassword
      MultiAZ: false
      Port: !Ref DatabasePort
      PreferredBackupWindow: "08:00-09:00"
      PreferredMaintenanceWindow: "Sun:07:00-Sun:08:00"
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !Ref DBSecurityGroup

  ##
  ## CloudWatch resources
  ##
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: talk-radio
      RetentionInDays: 30

  ##
  ## ECS infrastructure
  ##
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: talk-radio
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref InstanceRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:       ## Properties from LaunchConfiguration
        ImageId: !Ref ECSAMI
        KeyName: !Ref KeyPair
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref InstanceProfile
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeviceIndex: 0
            Groups:
              - !Ref ComputeSecurityGroup
        UserData:
          "Fn::Base64": !Sub |
            #!/bin/bash -xe
            yum install -y aws-cfn-bootstrap
            /opt/aws/bin/cfn-init -v --stack ${AWS::StackId} --resource LaunchTemplate --configsets full_install --region ${AWS::Region} &
            /opt/aws/bin/cfn-signal -e $? --region ${AWS::Region} --stack ${AWS::StackName} --resource AutoScalingGroup
      VersionDescription: '0'
    Metadata:
      AWS::CloudFormation::Init:
        config:
          packages:
            yum:
              awslogs: []

          commands:
            01_add_instance_to_cluster:
              command: !Sub echo ECS_CLUSTER=${Cluster} >> /etc/ecs/ecs.config

            02_reserve_system_memory:
              command: echo ECS_RESERVED_MEMORY=256 >> /etc/ecs/ecs.config

          files:
            "/etc/cfn/cfn-hup.conf":
              mode: 000400
              owner: root
              group: root
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}

            "/etc/cfn/hooks.d/cfn-auto-reloader.conf":
              content: !Sub |
                [cfn-auto-reloader-hook]
                triggers=post.update
                path=Resources.LaunchTemplate.Metadata.AWS::CloudFormation::Init
                action=/opt/aws/bin/cfn-init -v --region ${AWS::Region} --stack ${AWS::StackName} --resource LaunchTemplate

            "/etc/awslogs/awscli.conf":
              content: !Sub |
                [plugins]
                cwlogs = cwlogs
                [default]
                region = ${AWS::Region}

            "/etc/awslogs/awslogs.conf":
              content: !Sub |
                [general]
                state_file = /var/lib/awslogs/agent-state

                [/var/log/dmesg]
                file = /var/log/dmesg
                log_group_name = ${Cluster}-/var/log/dmesg
                log_stream_name = {instance_id}/var/log/dmesg

                [/var/log/messages]
                file = /var/log/messages
                log_group_name = ${Cluster}-/var/log/messages
                log_stream_name = {instance_id}/var/log/messages
                datetime_format = %b %d %H:%M:%S

                [/var/log/docker]
                file = /var/log/docker
                log_group_name = ${Cluster}-/var/log/docker
                log_stream_name = {instance_id}/var/log/docker
                datetime_format = %Y-%m-%dT%H:%M:%S.%f

                [/var/log/ecs/ecs-init.log]
                file = /var/log/ecs/ecs-init.log.*
                log_group_name = ${Cluster}-/var/log/ecs/ecs-init.log
                log_stream_name = {instance_id}/var/log/ecs/ecs-init.log
                datetime_format = %Y-%m-%dT%H:%M:%SZ

                [/var/log/ecs/ecs-agent.log]
                file = /var/log/ecs/ecs-agent.log.*
                log_group_name = ${Cluster}-/var/log/ecs/ecs-agent.log
                log_stream_name = {instance_id}/var/log/ecs/ecs-agent.log
                datetime_format = %Y-%m-%dT%H:%M:%SZ

                [/var/log/ecs/audit.log]
                file = /var/log/ecs/audit.log.*
                log_group_name = ${Cluster}-/var/log/ecs/audit.log
                log_stream_name = {instance_id}/var/log/ecs/audit.log
                datetime_format = %Y-%m-%dT%H:%M:%SZ
              
                [/var/log/cloud-init-output.log]
                file = /var/log/cloud-init-output.log
                log_group_name = ${Cluster}-/var/log/cloud-init-output
                log_stream_name = {instance_id}/var/log/cloud-init-output
                datetime_format = %Y-%m-%dT%H:%M:%SZ

                sleep 120

          services:
            sysvinit:
              cfn-hup:
                enabled: true
                ensureRunning: true
                files:
                  - /etc/cfn/cfn-hup.conf
                  - /etc/cfn/hooks.d/cfn-auto-reloader.conf

              awslogs:
                enabled: true
                ensureRunning: true
                files:
                  - /etc/awslogs/awslogs.conf
                  - /etc/awslogs/awscli.conf

  # Create an ECS capacity provider to attach the ASG to the ECS cluster
  # so that it autoscales as we launch more containers
  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          InstanceWarmupPeriod: 60
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 100
          Status: ENABLED
          # Percentage of cluster reservation to try to maintain
          TargetCapacity: 100
        ManagedTerminationProtection: ENABLED

  # Create a cluster capacity provider assocation so that the cluster
  # will use the capacity provider
  CapacityProviderAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      CapacityProviders:
        - !Ref CapacityProvider
      Cluster: !Ref Cluster
      DefaultCapacityProviderStrategy:
        - Base: 0
          CapacityProvider: !Ref CapacityProvider
          Weight: 1


  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      # This is to ensure that the ASG gets deleted first before these
      # resources, when it comes to stack teardown.
      - Cluster
      - InstanceRole
    Properties:
      VPCZoneIdentifier:
        - !Ref ComputeSubnetA
        - !Ref ComputeSubnetB
      # LaunchConfigurationName: !Ref LaunchConfiguration
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: 0
      MaxSize:
        Ref: MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      NewInstancesProtectedFromScaleIn: true
      Tags:
        - Key: Name
          Value: talk-radio ECS host
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: "true"

  ##
  ## Our task and service
  ##
  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: talk-radio-task-worker
      ContainerDefinitions:
        - Name: talk-radio-worker
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/talk-radio/worker:latest
          Essential: true
          MemoryReservation: 285
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Sub ${AWS::Region}

            - Name: DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DATABASE_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DATABASE_DBNAME
              Value: !Ref DatabaseDBName
            - Name: DATABASE_USERNAME
              Value: !Ref DatabaseUsername
            - Name: DATABASE_PASSWORD_KEY
              Value: !Ref DatabasePasswordKey

            - Name: S3_BUCKET
              Value: !Ref TargetS3Bucket
            - Name: S3_PREFIX
              Value: !Ref TargetS3Prefix

            - Name: DATA_SOURCE_S3_BUCKET
              Value: !Ref SourceS3Bucket
            - Name: DATA_SOURCE_S3_KEY
              Value: !Ref SourceS3Key
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: talk-radio-task-worker

  WorkerService:
    Type: AWS::ECS::Service
    DependsOn: AutoScalingGroup
    Properties:
      Cluster: !Ref Cluster
      LaunchType: EC2
      TaskDefinition: !Ref WorkerTask
      DesiredCount: !Ref DesiredWorkerCount
      PlacementStrategies:
        - Type: binpack
          Field: memory

Outputs:
  Cluster:
    Description: The ingest ECS cluster
    Value: !Ref Cluster

  DatabaseHost:
    Description: Hostname of the ingest database
    Value: !GetAtt Database.Endpoint.Address

  DatabasePort:
    Description: Postgres port of the ingest database
    Value: !GetAtt Database.Endpoint.Port

  CapacityProvider:
    Description: The cluster capacity provider that the service should use to
      request capacity when it wants to start up a task
    Value: CapacityProvider

